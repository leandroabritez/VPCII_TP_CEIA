[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vpcii-tp-fracture-detection"
version = "0.1.0"
description = "Detección automática de fracturas óseas en radiografías mediante modelos de visión por computadora"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10,<3.13"
authors = [
  { name = "Lucia T. Capon Paul" },
  { name = "Cesar Orellana" },
  { name = "Leandro Britez" },
]
keywords = ["computer-vision", "object-detection", "yolo", "bone-fracture", "deep-learning"]

dependencies = [
  "torch>=2.2.0",
  "torchvision>=0.17.0",
  "ultralytics>=8.3.0",
  "roboflow>=1.1.0",
  "opencv-python>=4.9.0.80",
  "Pillow>=10.2.0",
  "numpy>=1.26.0",
  "pandas>=2.2.0",
  "scikit-learn>=1.4.0",
  "matplotlib>=3.8.0",
  "seaborn>=0.13.0",
  "ipykernel>=6.29.0",
  "ipywidgets>=8.1.0",
  "tqdm>=4.66.0",
  "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.0.0",
  "black>=24.0.0",
  "ruff>=0.3.0",
  "pytest>=8.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.black]
line-length = 100
target-version = ["py310", "py311"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# ── uv: fuente explícita para PyTorch ────────────────────────────────────────
# uv necesita saber de qué índice proviene torch para resolver sin ambigüedad.
# Usamos el índice estándar de PyTorch (CPU por defecto; cambiar a cu121/cu124
# para soporte CUDA).
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]
