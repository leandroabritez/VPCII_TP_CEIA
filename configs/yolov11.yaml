# ─────────────────────────────────────────────────────────────────────────────
# Configuración de entrenamiento – YOLO11 (Experimento 1 - RAW)
# ─────────────────────────────────────────────────────────────────────────────

# Modelo base preentrenado (COCO)
model_weights: "yolo11m.pt"

# Hiperparámetros de entrenamiento
epochs: 100
imgsz: 640
batch: 16
workers: 0                   # CRÍTICO EN WINDOWS: Evita que el DataLoader se congele o demore 10 minutos por epoch
cache: False                 # Evitar saturar RAM de Windows con imágenes en datasets grandes
lr0: 0.01
lrf: 0.001
momentum: 0.937
weight_decay: 0.0005
warmup_epochs: 3.0
patience: 30                 # Early stopping para evitar overfitting en datasets médicos pequeños
seed: 42                     # Semilla fija para reproducibilidad frente a YOLOv10

# Data Augmentation (Adaptado al dominio de Rayos X)
hsv_h: 0.0                   # 0.0: Las radiografías son monocromáticas; el matiz añade artefactos artificiales
hsv_s: 0.0                   # 0.0: Sin saturación de color
hsv_v: 0.3                   # 0.3: Variación de brillo/exposición radiográfica
degrees: 5.0                 # Rotación leve (variación postural anatómica)
translate: 0.1
scale: 0.5
flipud: 0.0                  # Correcto: no invertir verticalmente para respetar orientación clínica
fliplr: 0.5                  # Espejo horizontal válido (huesos izq/der)
mosaic: 0.5                  # 0.5 o 1.0 (se desactiva automáticamente en las últimas épocas vía close_mosaic)
mixup: 0.0                   # 0.0: Evitar superposición de dos radiografías que confunda líneas de fractura
copy_paste: 0.0

# Parámetros de NMS e Inferencia
conf: 0.25
iou: 0.6                     # 0.6 / 0.7 para evaluar el impacto de NMS